version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: locales-postgres
    environment:
      POSTGRES_DB: locales_db
      POSTGRES_USER: locales_user
      POSTGRES_PASSWORD: locales_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U locales_user -d locales_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: locales-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://locales_user:locales_password@postgres:5432/locales_db
      - ENVIRONMENT=development
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: locales-frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev

volumes:
  postgres_data:
